<!doctype html>
<html lang="ti" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#b45309" />
    <meta name="description" content="ታሪኻዊ መዝገብ ወለዶ ተወለድ እንዳቦይ ከንትባ ጉዕሽ" />
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ተወለድ እንዳቦይ ከንትባ ጉዕሽ" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>ተወለድ እንዳቦይ ከንትባ ጉዕሽ</title>

    <!-- Preconnect & Load Noto Sans Ethiopic and Inter fonts for reliable Tigrinya/Ge'ez typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800&family=Noto+Serif+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-stone-50 text-stone-900 font-sans antialiased selection:bg-amber-100 selection:text-amber-900 pb-16 md:pb-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration & Live Auto-Update Controller -->
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Unregister any leftover service worker on localhost that may cause white screens
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (const name of names) {
                if (name.startsWith('kinteba-guush')) {
                  caches.delete(name);
                }
              }
            });
          }
        } else if (window.location.protocol.startsWith('http')) {
          let refreshing = false;

          // When service worker updates and takes control, auto-reload once to display fresh app code
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });

          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then((reg) => {
              // Proactively check for newer sw.js every time the page opens
              reg.update();

              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // New version ready: skip waiting to activate immediately
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            }).catch((err) => {
              console.warn('Service worker registration note:', err);
            });
          });
        }
      }
    </script>
  </body>
</html>
